openapi: "3.0.3"

info:
  title: RSV360 — Recommendations & Catalog API
  description: |
    API de recomendações Combo IA e sincronização de catálogo da plataforma RSV360 (Reservei Viagens).
    Documenta os endpoints de recomendação por afinidade de grupos hoteleiros e o endpoint de
    sincronização do catálogo de ingressos.
  version: "1.0.0"
  contact:
    name: Reservei Viagens
    url: https://reservei.com.br

servers:
  - url: /api/v1
    description: API v1 (Express + Vite proxy)
  - url: /api
    description: Rotas legadas (sem prefixo v1)

tags:
  - name: recommendations
    description: Motor de recomendações Combo IA — sugestões por afinidade de grupos
  - name: sync
    description: Sincronização e seed do catálogo de ingressos
  - name: catalog
    description: Consulta ao catálogo de ingressos e grupos hoteleiros
  - name: search
    description: Busca geral de itens (excursões, hotéis, parques, destinos)

paths:

  /recommendations:
    get:
      summary: Lista recomendações de combo para o perfil e carrinho informado
      description: |
        Retorna sugestões de combo IA baseadas em afinidade entre grupos hoteleiros
        (DIROMA, PRIVE, GOLDEN_DOLPHIN, RIO_QUENTE, INDEPENDENTE) e perfil do viajante.
        Desconto de 15% aplicado automaticamente quando combo tem ≥ 2 itens compatíveis.
      tags: [recommendations]
      parameters:
        - name: profile
          in: query
          required: false
          description: Perfil do viajante
          schema:
            type: string
            enum: [familia, casal, jovem, melhor-idade, corporativo, escolar]
            example: familia
        - name: ticketIds
          in: query
          required: false
          description: IDs dos ingressos já no carrinho (separados por vírgula)
          schema:
            type: string
            example: "hot-park,diroma-acqua-park"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 10
            default: 5
      responses:
        "200":
          description: Recomendações geradas com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecommendationListResponse"
              example:
                recommendations:
                  - ticketId: "cabana-standard"
                    name: "Cabana Standard — até 4 pessoas"
                    unitPrice: 280
                    originalPrice: 350
                    comboDiscount: 15
                    reason: "Complementa Hot Park — mesmo complexo Rio Quente Resorts"
                    affinityScore: 92
                comboAvailable: true
                comboDiscount: 15
        "400":
          description: Parâmetros inválidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /recommendations/sync:
    post:
      summary: Sincroniza o catálogo de ingressos no banco de dados
      description: |
        Executa upsert idempotente de todos os ingressos definidos em `ticket-catalog.ts`
        para o store persistente. Reruns não geram duplicatas. O campo `basePrice` é preservado
        quando já existir (não sobrescreve tarifa oficial com 0). Retorna contagem de criados/atualizados.
        Requer papel `admin`.
      tags: [sync, recommendations]
      security:
        - sessionCookie: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                dryRun:
                  type: boolean
                  default: false
                  description: Se true, apenas simula o sync sem persistir
      responses:
        "200":
          description: Sincronização concluída
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncResponse"
              example:
                created: 3
                updated: 24
                total: 27
                dryRun: false
                syncedAt: "2026-03-27T10:00:00.000Z"
        "401":
          description: Não autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Sem permissão (somente admin)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /catalog/tickets:
    get:
      summary: Lista todos os ingressos do catálogo sincronizado
      tags: [catalog]
      parameters:
        - name: group
          in: query
          required: false
          description: Filtrar por grupo hoteleiro
          schema:
            type: string
            enum: [DIROMA, PRIVE, GOLDEN_DOLPHIN, RIO_QUENTE, INDEPENDENTE]
        - name: slug
          in: query
          required: false
          description: Busca por slug exato
          schema:
            type: string
            example: "ingresso-hot-park-adulto"
      responses:
        "200":
          description: Lista de ingressos do catálogo
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/CatalogTicket"
                  total:
                    type: integer
                    example: 27

  /search:
    get:
      summary: Busca geral de itens no catálogo RSV360
      tags: [search]
      parameters:
        - name: q
          in: query
          required: false
          description: Texto livre para busca por nome, descrição ou tags
          schema:
            type: string
            example: "hot park família"
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum: [excursion, hotel, park, attraction, destination]
        - name: city
          in: query
          required: false
          schema:
            type: string
            example: "Caldas Novas"
        - name: profile
          in: query
          required: false
          schema:
            type: string
            example: "família"
        - name: minPrice
          in: query
          required: false
          schema:
            type: number
        - name: maxPrice
          in: query
          required: false
          schema:
            type: number
        - name: rating
          in: query
          required: false
          description: Nota mínima (0–5)
          schema:
            type: number
            minimum: 0
            maximum: 5
        - name: sortBy
          in: query
          required: false
          schema:
            type: string
            enum: [relevance, price_asc, price_desc, rating, popularity]
            default: relevance
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 12
      responses:
        "200":
          description: Resultados da busca
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResponse"

  /search/suggest:
    get:
      summary: Autocompletar — sugestões rápidas para a barra de busca
      tags: [search]
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 2
            example: "hot"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 10
            default: 5
      responses:
        "200":
          description: Lista de sugestões
          content:
            application/json:
              schema:
                type: object
                properties:
                  suggestions:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                        type:
                          type: string
                        slug:
                          type: string

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: connect.sid
      description: Sessão Express com userId na sessão (via /api/auth/login)

  schemas:

    CatalogTicket:
      type: object
      required: [id, name, slug, group, groupLabel, basePrice, originalPrice]
      properties:
        id:
          type: string
          example: "hot-park"
        name:
          type: string
          example: "Ingresso Hot Park — Adulto"
        slug:
          type: string
          example: "ingresso-hot-park-adulto"
        group:
          type: string
          enum: [DIROMA, PRIVE, GOLDEN_DOLPHIN, RIO_QUENTE, INDEPENDENTE]
          example: "RIO_QUENTE"
        groupLabel:
          type: string
          example: "Rio Quente Resorts"
        basePrice:
          type: number
          description: Preço base atual (0 enquanto tarifa oficial não sincronizada)
          example: 189
        originalPrice:
          type: number
          description: Preço original antes de desconto
          example: 220
        syncedAt:
          type: string
          format: date-time
          example: "2026-03-27T10:00:00.000Z"

    RecommendationListResponse:
      type: object
      properties:
        recommendations:
          type: array
          items:
            $ref: "#/components/schemas/RecommendedItem"
        comboAvailable:
          type: boolean
          description: Verdadeiro se combo com desconto está disponível (≥ 2 itens compatíveis)
        comboDiscount:
          type: number
          description: Percentual de desconto aplicado no combo
          example: 15

    RecommendedItem:
      type: object
      properties:
        ticketId:
          type: string
        name:
          type: string
        unitPrice:
          type: number
        originalPrice:
          type: number
        comboDiscount:
          type: number
          example: 15
        reason:
          type: string
          description: Justificativa da recomendação gerada pela IA
          example: "Combina com Hot Park — mesmo complexo Rio Quente Resorts"
        affinityScore:
          type: number
          description: Score de afinidade 0–100
          example: 87

    SyncResponse:
      type: object
      required: [created, updated, total, syncedAt]
      properties:
        created:
          type: integer
          description: Entradas novas inseridas
          example: 3
        updated:
          type: integer
          description: Entradas existentes atualizadas
          example: 24
        total:
          type: integer
          description: Total de entradas no catálogo após sync
          example: 27
        dryRun:
          type: boolean
          example: false
        syncedAt:
          type: string
          format: date-time
          example: "2026-03-27T10:00:00.000Z"

    SearchResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SearchItem"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
        hasMore:
          type: boolean

    SearchItem:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          enum: [excursion, hotel, park, attraction, destination]
        name:
          type: string
        slug:
          type: string
        city:
          type: string
        state:
          type: string
        priceFrom:
          type: number
        rating:
          type: number
        reviewCount:
          type: integer
        isFeatured:
          type: boolean
        comboAvailable:
          type: boolean
        images:
          type: array
          items:
            type: string
        descriptionShort:
          type: string

    ErrorResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string
          example: "Não autorizado"
        code:
          type: string
          example: "UNAUTHORIZED"
